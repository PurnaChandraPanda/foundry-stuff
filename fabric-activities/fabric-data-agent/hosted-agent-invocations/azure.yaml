# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: hosted-agent-invocations
services:
    fabric-dataagent-invocations:
        project: ./src/fabric-dataagent-invocations
        host: azure.ai.agent
        language: python
        uses:
            - proj-default
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            FABRIC_CONNECTION_NAME: ${FABRIC_CONNECTION_NAME}
            AZURE_AI_PROJECT_ID: ${AZURE_AI_PROJECT_ID}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: fabric-dataagent-invocations
        protocols:
            - protocol: invocations
              version: 2.0.0
    proj-default:
        host: azure.ai.project
        endpoint: ${AZURE_AI_PROJECT_ENDPOINT}
infra:
    provider: microsoft.foundry
